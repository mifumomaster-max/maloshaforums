    <!-- Capture beforeinstallprompt early before React hydrates -->
    <script>
      window.__deferredPWAPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPWAPrompt = e;
        window.dispatchEvent(new CustomEvent('malosha-pwa-prompt-ready'));
      });
    </script>

    <!-- Instant Pre-React Splash Screen Styles (Prevents Blank Page on Open) -->
    <style>
      .malosha-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #163a5f 0%, #0e2640 55%, #09192b 100%);
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .malosha-boot-stripe {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #d97706 0%, #f59e0b 50%, #38bdf8 100%);
      }
      .malosha-spinner-stage {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .malosha-ring-outer {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #f59e0b;
        border-right-color: rgba(245, 158, 11, 0.45);
        animation: malosha-spin 1.05s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
      }
      .malosha-ring-inner {
        position: absolute;
        inset: 10px;
        border-radius: 9999px;
        border: 2.5px solid rgba(56, 189, 248, 0.12);
        border-bottom-color: #38bdf8;
        animation: malosha-spin-rev 1.5s linear infinite;
      }
      .malosha-emblem-box {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(217, 119, 6, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      }
      .malosha-boot-title {
        margin: 22px 0 0;
        font-family: 'Fraunces', Georgia, serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      .malosha-boot-subtitle {
        margin: 8px 0 0;
        font-size: 13px;
        font-weight: 500;
        color: rgba(226, 232, 240, 0.85);
      }
      .malosha-boot-bar {
        margin-top: 20px;
        width: 140px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .malosha-boot-bar-fill {
        width: 45%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #f59e0b, #38bdf8);
        animation: malosha-slide 1.25s ease-in-out infinite;
      }
      @keyframes malosha-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes malosha-spin-rev {
        to {
          transform: rotate(-360deg);
        }
      }
      @keyframes malosha-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .malosha-ring-outer,
        .malosha-ring-inner,
        .malosha-boot-bar-fill {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="bg-[#F1F4F8] text-slate-900 antialiased selection:bg-emerald-900/15 selection:text-emerald-950">
    <div id="root">

        <div class="malosha-boot-bar" aria-hidden="true">

        </div>
      </div>
    </div>
